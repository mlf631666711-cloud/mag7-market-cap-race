<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动效库 · 数据叙事 · seek 渲染版</title>
<style>
  :root{
    --bg:#080a0f; --panel:#12151d; --line:#232838;
    --txt:#eef2fb; --muted:#8b93a7; --accent:#5b8cff; --accent2:#7c5cff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  /* 渲染版：写死画布尺寸，禁用 flex 居中（避免超屏 stage 被裁） */
  html,body{width:1920px; height:1080px; margin:0; padding:0; overflow:hidden;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased;
  }
  #app{position:absolute; inset:0; overflow:hidden;}
  #bg{position:absolute; inset:0; width:100%; height:100%; display:block;}

  /* ===== stage ===== */
  #stage{position:absolute; inset:0; display:flex; flex-direction:column;}

  /* intro overlay —— 注意：已移除全部 CSS animation，改由 seek() 驱动 */
  #intro{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:5; background:radial-gradient(120% 90% at 50% 40%, rgba(124,92,255,.26), rgba(8,10,15,.99) 60%);
  }
  #intro .kicker{font-size:13px; letter-spacing:6px; color:var(--accent); font-weight:700; opacity:0;}
  #title{font-size:clamp(34px,5.4vw,68px); font-weight:900; letter-spacing:2px; margin-top:14px; display:flex; gap:2px;}
  #title span{
    display:inline-block; opacity:0; transform:translateY(34px) scale(.6);
    background:linear-gradient(180deg,#fff,#9fb4ff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #sub{margin-top:18px; font-size:clamp(12px,1.4vw,16px); letter-spacing:3px; color:var(--muted); opacity:0;}
  #intro .sweep{position:absolute; left:-30%; top:0; width:30%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(124,92,255,.18),transparent); transform:skewX(-18deg);}

  /* race area */
  #race{flex:1; position:relative; padding:34px 48px 46px;}
  .topline{position:absolute; top:30px; left:48px; right:48px; display:flex; align-items:flex-start; justify-content:space-between;}
  .unit{font-size:12.5px; letter-spacing:1px; color:var(--muted);}
  .unit b{color:var(--txt);}
  #year{font-size:clamp(40px,6vw,82px); font-weight:900; line-height:.9; letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#7c8cff); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 50px rgba(91,140,255,.25); font-variant-numeric:tabular-nums;}
  #year small{display:block; font-size:13px; font-weight:700; letter-spacing:3px; color:var(--muted); -webkit-text-fill-color:var(--muted); margin-top:6px;}

  #bars{position:absolute; left:48px; right:138px; top:148px; bottom:134px;}
  .row{position:absolute; left:0; right:0; display:flex; align-items:center; gap:16px; will-change:transform; isolation:isolate;}
  .namer{flex:0 0 158px; text-align:right; line-height:1.15;
    text-shadow:2px 0 0 rgba(8,10,15,.95), -2px 0 0 rgba(8,10,15,.95), 0 2px 0 rgba(8,10,15,.95), 0 -2px 0 rgba(8,10,15,.95);}
  .namer .nm{font-size:clamp(14px,1.5vw,19px); font-weight:800; color:var(--txt);}
  .namer .tk{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--c); opacity:.9;}
  .namer .dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); margin-right:7px; vertical-align:middle; box-shadow:0 0 10px var(--c);}
  .chart{position:relative; flex:1; height:64%;}
  .track{position:absolute; left:0; right:0; top:50%; height:7px; transform:translateY(-50%);
    background:rgba(255,255,255,.05); border-radius:7px;}
  .fill{position:absolute; left:0; top:0; height:100%; border-radius:9px; background:var(--c);
    box-shadow:0 0 16px -3px var(--c);}
  .lead .fill{box-shadow:0 0 30px -2px var(--c), 0 0 60px -10px var(--c);}
  .val{position:absolute; top:50%; transform:translateY(-50%); font-weight:800; font-size:clamp(12px,1.3vw,16px);
    color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; white-space:nowrap;}

  /* outro lower-third —— 已移除 transition，改由 seek() 驱动 */
  #outro{position:absolute; left:48px; right:48px; bottom:58px; z-index:6;
    transform:translateY(160%); opacity:0;}
  .lt{display:inline-flex; align-items:center; gap:16px; max-width:92%;
    background:linear-gradient(120deg, rgba(124,92,255,.22), rgba(91,140,255,.12));
    border:1px solid rgba(124,92,255,.5); border-left:4px solid #7c5cff;
    padding:16px 22px; border-radius:14px; backdrop-filter:blur(6px);
    box-shadow:0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(124,92,255,.12);}
  .lt .em{font-size:30px;}
  .lt .txt b{color:#fff; font-size:clamp(15px,1.7vw,21px); font-weight:800;}
  .lt .txt div{font-size:12.5px; color:var(--muted); margin-top:5px; letter-spacing:.3px;}
  .lt .txt b .hl{color:#a3e635;}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <div id="stage">
    <div id="race">
      <div class="topline">
        <div class="unit" id="unit"></div>
        <div id="year">2014<small id="yearTag"></small></div>
      </div>
      <div id="bars"></div>
    </div>

    <div id="intro">
      <div class="sweep" id="sweep"></div>
      <div class="kicker" id="kicker"></div>
      <div id="title"></div>
      <div id="sub"></div>
    </div>

    <div id="outro">
      <div class="lt">
        <div class="em" id="outroEmoji">🏆</div>
        <div class="txt">
          <b id="outroTitle"></b>
          <div id="outroDesc"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
   *  PRESET 模板区（与原版 effects.html 完全一致）
   * ========================================================================= */
  const PRESETS = [
    {
      id:'mag7',
      label:'科技七雄 · 市值赛跑',
      kicker:'REMOTION · DATA STORY',
      title:'科技七雄 · 十年市值赛跑',
      sub:'MAGNIFICENT 7 · A DECADE OF MARKET CAP',
      unit:'单位：<b>十亿美元</b> · 上市公司市值 · 数据 2014–2024',
      yearTag:'MARKET CAP RACE',
      years:[2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024],
      fmt:v => '$' + Math.round(v).toLocaleString() + 'B',
      outro:{
        emoji:'🏆',
        title:'<span class="hl">英伟达 NVDA</span>：十年 $11B → $3,355B，暴涨约 <span class="hl">300 倍</span>',
        desc:'从榜单末尾一路超车冲到第二 —— AI 浪潮下最陡的市值曲线 · 数据来源：Visual Capitalist / CompaniesMarketCap'
      },
      companies:[
        {key:'GOOG', name:'谷歌',   tk:'GOOG', c:'#5b8cff', v:[360,528,539,729,724,921,1185,1917,1145,1756,2365]},
        {key:'AMZN', name:'亚马逊', tk:'AMZN', c:'#ffa94d', v:[144,318,356,564,737,920,1634,1691,857,1570,2352]},
        {key:'AAPL', name:'苹果',   tk:'AAPL', c:'#e9edf2', v:[643,584,609,861,746,1287,2255,2901,2066,2994,3863]},
        {key:'META', name:'Meta',  tk:'META', c:'#b07cff', v:[217,297,332,513,374,585,778,922,320,910,1514]},
        {key:'MSFT', name:'微软',   tk:'MSFT', c:'#2dd4bf', v:[382,440,483,660,780,1200,1681,2522,1787,2794,3200]},
        {key:'NVDA', name:'英伟达', tk:'NVDA', c:'#a3e635', v:[11,18,58,117,81,144,323,735,364,1223,3355]},
        {key:'TSLA', name:'特斯拉', tk:'TSLA', c:'#ff5d73', v:[28,32,34,52,57,76,669,1061,389,790,1385]}
      ]
    },
    {
      id:'phone',
      label:'手机出货 · 厂商争霸',
      kicker:'REMOTION · DATA STORY',
      title:'全球手机出货 · 厂商争霸',
      sub:'SMARTPHONE SHIPMENTS · VENDOR RACE',
      unit:'单位：<b>百万台</b> · 全球智能手机出货量 · 数据 2020–2024',
      yearTag:'SHIPMENTS RACE',
      years:[2020,2021,2022,2023,2024],
      fmt:v => (v/100).toFixed(2) + ' 亿台',
      outro:{
        emoji:'📱',
        title:'<span class="hl">三星</span> 守擂多年，<span class="hl">苹果</span> 2023 首超登顶',
        desc:'中国换机周期拉长，大盘在 12 亿台上下徘徊 · 数据来源：IDC / Canalys（2022–2024 实测，2020–2021 近似）'
      },
      companies:[
        {key:'SAMS', name:'三星',   tk:'SSNLF', c:'#5b8cff', v:[253.3,272.0,258.2,226.6,223.4]},
        {key:'AAPL', name:'苹果',   tk:'AAPL', c:'#e9edf2', v:[206.1,235.7,226.3,234.6,232.1]},
        {key:'MI',   name:'小米',   tk:'XIACY', c:'#ffa94d', v:[147.8,191.2,152.7,145.9,168.5]},
        {key:'OPPO', name:'OPPO',   tk:'OPPO', c:'#2dd4bf', v:[144.0,143.0,114.4,103.1,104.8]}
      ]
    }
  ];

  // ===== DOM =====
  const barsEl = document.getElementById('bars');
  const yearEl = document.getElementById('year');
  const yearTagEl = document.getElementById('yearTag');
  const introEl = document.getElementById('intro');
  const outroEl = document.getElementById('outro');
  const kickerEl = document.getElementById('kicker');
  const subEl = document.getElementById('sub');
  const unitEl = document.getElementById('unit');
  const titleEl = document.getElementById('title');
  const sweepEl = document.getElementById('sweep');
  const outroEmoji = document.getElementById('outroEmoji');
  const outroTitle = document.getElementById('outroTitle');
  const outroDesc = document.getElementById('outroDesc');

  const clamp = (x,a,b)=> x<a?a:(x>b?b:x);

  /* ---------- 三次贝塞尔求解（替代 CSS cubic-bezier） ---------- */
  function cubicBezier(x1,y1,x2,y2){
    const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, C=a=>3*a;
    const calc=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t;
    const slope=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
    return function(x){
      if(x<=0) return 0;
      if(x>=1) return 1;
      let t=x;
      for(let i=0;i<8;i++){
        const s=slope(t,x1,x2);
        if(Math.abs(s)<1e-6) break;
        t -= (calc(t,x1,x2)-x)/s;
        t = clamp(t,0,1);
      }
      return calc(t,y1,y2);
    };
  }
  const EASE        = cubicBezier(.25,.1,.25,1);   // CSS ease
  const EASE_IN_OUT = cubicBezier(.42,0,.58,1);    // CSS ease-in-out
  const POP         = cubicBezier(.34,1.56,.64,1); // 片头逐字 pop（带过冲）
  const OUT_EASE    = cubicBezier(.22,1,.36,1);    // 落版字幕条

  /* ---------- 确定性伪随机（替代 Math.random） ---------- */
  let _seed = 20260804;
  function rnd(){
    _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0;
    return _seed / 4294967296;
  }

  // ===== 时间线（按年份数自适应，每年约 680ms）=====
  let INTRO = 2200, RACE_END = 9000, DURATION = 10400;
  function recomputeTiming(){
    const n = current.years.length;
    INTRO = 2200;
    RACE_END = INTRO + (n - 1) * 680;
    DURATION = RACE_END + 1400;
  }

  // ===== 当前预设状态 =====
  let current = PRESETS[0];
  let companies = current.companies;

  function buildTitle(text){
    titleEl.innerHTML = '';
    [...text].forEach((ch)=>{
      const s = document.createElement('span');
      s.textContent = ch;
      titleEl.appendChild(s);
    });
  }

  function buildRows(){
    barsEl.innerHTML = '';
    companies.forEach(c=>{
      const row = document.createElement('div');
      row.className = 'row'; row.style.setProperty('--c', c.c);
      row.innerHTML =
        '<div class="namer"><div><span class="dot"></span><span class="nm">'+c.name+'</span></div><div class="tk">'+c.tk+'</div></div>'+
        '<div class="chart"><div class="track"></div><div class="fill"></div><div class="val"></div></div>';
      barsEl.appendChild(row);
      c.el = row; c.fill = row.querySelector('.fill'); c.val = row.querySelector('.val'); c.namer = row.querySelector('.namer');
      c._disp = 0; c._rank = 0;
    });
  }

  function applyText(){
    kickerEl.textContent = current.kicker;
    subEl.textContent = current.sub;
    unitEl.innerHTML = current.unit;
    yearTagEl.textContent = current.yearTag;
    outroEmoji.textContent = current.outro.emoji;
    outroTitle.innerHTML = current.outro.title;
    outroDesc.textContent = current.outro.desc;
  }

  // ===== 布局 =====
  let ROW_H = 60;
  function layout(){
    const r = barsEl.getBoundingClientRect();
    ROW_H = r.height / companies.length;
    companies.forEach(c=>{ c.el.style.height = Math.max(20, ROW_H - 12) + 'px'; });
  }

  function valAt(c, vy){
    const y0 = current.years[0];
    const fy = vy - y0;
    if(fy <= 0) return c.v[0];
    if(fy >= c.v.length - 1) return c.v[c.v.length - 1];
    const i0 = Math.floor(fy);
    const f = fy - i0;
    return c.v[i0] + (c.v[i0+1] - c.v[i0]) * f;
  }

  /* =========================================================================
   *  流场粒子背景 —— 改为「确定性重放 + 轨迹缓冲」
   *  原版靠每帧 rgba(8,10,15,.22) 覆盖累积出拖尾，是帧序依赖的；
   *  这里在重放时记录每颗粒子的历史位置，绘制时按 0.78^age 衰减还原拖尾。
   * ========================================================================= */
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  const RS = Math.max(1, Math.min(2, Math.round(window.devicePixelRatio || 1)));
  let W=0, H=0, parts=[];
  const TRAIL = 22;

  function initBG(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W*RS); cv.height = Math.round(H*RS);
    ctx.setTransform(RS,0,0,RS,0,0);
    const n = Math.round(clamp(W*H/16000, 36, 90));
    parts = [];
    for(let i=0;i<n;i++){
      parts.push({
        x: rnd()*W, y: rnd()*H, vx:0, vy:0, life: rnd()*200,
        trail: new Array(TRAIL).fill(null), tn: 0
      });
    }
  }

  let bgT = 0;
  function stepParticles(){
    bgT += 0.005;
    for(const p of parts){
      const a = Math.sin(p.x*0.004 + bgT) + Math.cos(p.y*0.004 - bgT);
      const ang = a * 1.4;
      p.vx += (Math.cos(ang)*0.06 - p.vx)*0.04;
      p.vy += (Math.sin(ang)*0.06 - p.vy)*0.04;
      p.x += p.vx*1.6; p.y += p.vy*1.6; p.life += 1;
      if(p.x<0)p.x+=W; if(p.x>W)p.x-=W; if(p.y<0)p.y+=H; if(p.y>H)p.y-=H;
      const al = 0.18 + 0.18*Math.sin(p.life*0.05);
      p.trail[p.tn % TRAIL] = {x:p.x, y:p.y, a:al};
      p.tn++;
    }
  }

  function paintParticles(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#080a0f';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(RS,0,0,RS,0,0);
    for(const p of parts){
      const total = p.tn;
      for(let k=0;k<TRAIL;k++){
        const idx = (p.tn - TRAIL + k + TRAIL*2) % TRAIL;
        const h = p.trail[idx];
        if(!h) continue;
        const age = TRAIL - 1 - k;              // 越靠后越新
        const fade = Math.pow(0.78, age);
        const al = h.a * fade;
        if(al < 0.004) continue;
        ctx.fillStyle = 'rgba(140,160,255,'+al.toFixed(3)+')';
        ctx.beginPath(); ctx.arc(h.x, h.y, 1.9, 0, 6.283); ctx.fill();
      }
    }
  }

  /* =========================================================================
   *  片头元素（原 CSS @keyframes 的等价实现，全部基于绝对时间 t）
   * ========================================================================= */
  function paintIntro(t){
    // kicker: fadeUp .7s .05s
    const kp = EASE(clamp((t - 50)/700, 0, 1));
    kickerEl.style.opacity = kp.toFixed(4);
    kickerEl.style.transform = 'translateY(' + ((1-kp)*16).toFixed(2) + 'px)';

    // title span: pop .7s, delay 0.12 + i*0.055
    const spans = titleEl.children;
    for(let i=0;i<spans.length;i++){
      const delay = (0.12 + i*0.055)*1000;
      const p = POP(clamp((t - delay)/700, 0, 1));
      spans[i].style.opacity = p.toFixed(4);
      spans[i].style.transform = 'translateY(' + ((1-p)*34).toFixed(2) + 'px) scale(' + (0.6 + 0.4*p).toFixed(4) + ')';
    }

    // sub: fadeUp .7s .9s
    const sp = EASE(clamp((t - 900)/700, 0, 1));
    subEl.style.opacity = sp.toFixed(4);
    subEl.style.transform = 'translateY(' + ((1-sp)*16).toFixed(2) + 'px)';

    // sweep: 1.6s .2s ease-in-out, left -30% → 130%
    const wp = EASE_IN_OUT(clamp((t - 200)/1600, 0, 1));
    sweepEl.style.left = (-30 + 160*wp).toFixed(3) + '%';
  }

  /* =========================================================================
   *  模拟推进 / 绘制
   * ========================================================================= */
  function resetSim(){
    _seed = 20260804;
    initBG();
    bgT = 0;
    companies.forEach(c=>{ c._disp = 0; c._rank = 0; });
  }

  // 只推进状态（不写 DOM），供重放使用
  function stepSim(tms){
    const y0 = current.years[0], yN = current.years[current.years.length-1];
    let vy;
    if(tms < INTRO) vy = y0;
    else if(tms > RACE_END) vy = yN;
    else vy = y0 + (tms - INTRO)/(RACE_END - INTRO) * (yN - y0);

    const vals = companies.map(c=>({c, v:valAt(c, vy)}));
    const sorted = vals.slice().sort((a,b)=> b.v - a.v);
    sorted.forEach((o,i)=> o.c._rank = i);
    vals.forEach(o=>{ o.c._disp += (o.c._rank - o.c._disp) * 0.16; });

    stepParticles();
  }

  // 把当前状态写进 DOM
  function paint(tms){
    const y0 = current.years[0];
    let vy;
    if(tms < INTRO) vy = y0;
    else if(tms > RACE_END) vy = current.years[current.years.length-1];
    else vy = y0 + (tms - INTRO)/(RACE_END - INTRO) * (current.years[current.years.length-1] - y0);

    const introOp = tms < INTRO ? 1 : Math.max(0, 1 - (tms - INTRO)/320);
    const chartFade = clamp(1 - introOp, 0, 1);

    const vals = companies.map(c=>({c, v:valAt(c, vy)}));
    const maxV = Math.max.apply(null, vals.map(o=>o.v));
    const dynMax = maxV * 1.08;

    vals.forEach(o=>{
      const pct = clamp(o.v / dynMax * 100, 2, 94);
      o.c.el.style.transform = 'translateY(' + (o.c._disp * ROW_H) + 'px)';
      o.c.fill.style.width = pct + '%';
      o.c.val.style.left = pct + '%';
      o.c.val.style.transform = 'translate(10px,-50%)';
      o.c.el.style.opacity = chartFade.toFixed(3);
      o.c.val.textContent = current.fmt(o.v);
      o.c.el.classList.toggle('lead', o.c._rank === 0);
    });

    yearEl.firstChild.nodeValue = String(Math.round(vy));

    introEl.style.opacity = introOp.toFixed(4);
    paintIntro(tms);

    // 落版：原 transition .45s cubic-bezier(.22,1,.36,1)
    const outP = OUT_EASE(clamp((tms - RACE_END)/450, 0, 1));
    outroEl.style.transform = 'translateY(' + ((1 - outP) * 160) + '%)';
    outroEl.style.opacity = outP.toFixed(4);

    paintParticles();
  }

  /* =========================================================================
   *  对外契约：window.seek(t秒) / window.__duration
   *  纯函数式：每次调用都从 0 重放到 t，任意 t 独立可解。
   *  重放步长固定 1/60s —— 原版 _disp 的 0.16 每帧系数是 60Hz 下的手感，
   *  步长必须一致才能还原同样的跟随速度。
   * ========================================================================= */
  const STEP = 1000/60;
  function seek(tSec){
    const t = clamp(tSec*1000, 0, DURATION);
    resetSim();
    let s = 0;
    while(s + STEP < t){ stepSim(s); s += STEP; }
    stepSim(t);
    paint(t);
  }
  window.seek = seek;
  window.__seek = seek;
  window.__duration = DURATION/1000;

  function loadPreset(idx){
    current = PRESETS[idx];
    companies = current.companies;
    applyText();
    buildTitle(current.title);
    buildRows();
    recomputeTiming();
    layout();
    window.__duration = DURATION/1000;
    resetSim();
    paint(0);
  }

  window.addEventListener('resize', ()=>{});

  // ===== 启动 =====
  loadPreset(0);

  if (window.__capture) {
    // 渲染模式：由外部逐帧调 window.seek(t)
    seek(0);
  } else {
    // 预览模式：实时循环
    const t0 = performance.now();
    (function loop(){
      const t = (performance.now() - t0) % (DURATION + 600);
      seek(t);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
